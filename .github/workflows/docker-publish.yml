name: Publish Docker images

on:
  push:
    branches:
      - nextjs
    paths:
      - Dockerfile
      - entrypoint.sh
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - tag: 16-latest
            node_version: "22"
            nextjs_version: "16"
          - tag: 22-latest
            node_version: "22"
            nextjs_version: "16"
          - tag: 20-latest
            node_version: "20"
            nextjs_version: "16"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NODE_VERSION=${{ matrix.node_version }}
            NEXTJS_VERSION=${{ matrix.nextjs_version }}
          tags: ghcr.io/mark7625/custom-pterodactyl-eggs/nextjs:${{ matrix.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
